  return { id, word, ipa, pos, en, vi, ex, exVi, topic, index: i };
});
const WORD_BY_ID = Object.fromEntries(WORDS.map(w => [w.id, w]));

/* ============================================================
   UTILITIES
   ============================================================ */
const DAY = 86400000;
const STORAGE_KEY = "vocabviet.v2";
const SESSION_SIZE = 20;
const DAILY_GOAL = 20;
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];

function dateKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function endOfToday() {
  const d = new Date();
  d.setHours(23, 59, 59, 999);
  return d.getTime();
}
function normalize(s) {
  return (s || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d");
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Speech synthesis ---------- */
let _voiceCache = null;
function pickEnglishVoice() {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  return (
    voices.find(v => v.lang === "en-GB") ||
    voices.find(v => (v.lang || "").startsWith("en-GB")) ||
    voices.find(v => (v.lang || "").startsWith("en")) ||
    null
  );
}
function speak(text) {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.rate = 0.9;
    const v = _voiceCache || pickEnglishVoice();
    if (v) { u.voice = v; _voiceCache = v; }
    window.speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}
if (typeof window !== "undefined" && "speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => { _voiceCache = pickEnglishVoice(); };
  setTimeout(() => { _voiceCache = pickEnglishVoice(); }, 300);
}

/* ============================================================
   SPACED REPETITION
   ============================================================ */
function isNewCard(card) {
  return !card || !card.lastReviewed;
}
function dueToday(card) {
  if (!card || !card.lastReviewed || !card.nextReview) return false;
  return card.nextReview <= endOfToday();
}
function applyRating(prevCard, rating) {
  const c = prevCard || {
    step: 0, reviewCount: 0, correctCount: 0, incorrectCount: 0,
    lastReviewed: null, nextReview: null, level: "new"
  };
  let step = c.step || 0;
  let correct = c.correctCount || 0;
  let incorrect = c.incorrectCount || 0;
  const now = Date.now();
  let next;

  if (rating === "again") {
    step = 0;
    incorrect += 1;
    next = now + 10 * 60 * 1000;
  } else if (rating === "good") {
    step = Math.min(step + 1, INTERVALS.length - 1);
    correct += 1;
    next = now + INTERVALS[step] * DAY;
  } else { // easy
    step = Math.min(step + 2, INTERVALS.length - 1);
    correct += 1;
    next = now + INTERVALS[step] * DAY;
  }

  const level = step >= 4 ? "mastered" : "learning";
  return {
    step, level,
    reviewCount: (c.reviewCount || 0) + 1,
    correctCount: correct,
    incorrectCount: incorrect,
    lastReviewed: now,
    nextReview: next
  };
}

  const [query, setQuery] = useState("");

  const [topic, setTopic] = useState("All");
  const [onlyFav, setOnlyFav] = useState(false);
  const [showFilters, setShowFilters] = useState(false);
  const [limit, setLimit] = useState(60);

  const filtered = useMemo(() => {
    const needle = normalize(query.trim());
    return WORDS.filter(w => {
      if (pos !== "All" && w.pos.toLowerCase() !== pos.toLowerCase()) return false;
      if (topic !== "All" && w.topic !== topic) return false;
      if (onlyFav && !favorites.has(w.id)) return false;
      if (needle) {
        const hay = normalize(w.word + " " + w.vi + " " + w.en + " " + w.ex);

      }
      return true;
    });
  }, [query, pos, topic, onlyFav, favorites]);

  useEffect(() => { setLimit(60); }, [query, pos, topic, onlyFav]);

  const visible = filtered.slice(0, limit);

  return (
    <div className="space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Vocabulary</h1>
        <p className="mt-1 text-sm text-slate-500">{WORDS.length} từ vựng · tra cứu & lọc nhanh</p>
      </div>

      <SearchBar value={query} onChange={setQuery} />

      <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
        <button
          onClick={() => setShowFilters(v => !v)}
          className="w-full flex items-center justify-between text-sm font-medium text-slate-700"
        >
          <span>🔎 Bộ lọc · {pos} · {topic}{onlyFav ? " · ★" : ""}</span>
          <span className="text-slate-400">{showFilters ? "▲" : "▼"}</span>
        </button>
        {showFilters && (
          <div className="mt-4 pt-4 border-t border-slate-100">
            <FilterPanel
              pos={pos} onPos={setPos}
              topic={topic} onTopic={setTopic}
              onlyFav={onlyFav} onOnlyFav={setOnlyFav}
              resultCount={filtered.length}
            />
          </div>
        )}
      </div>

      {visible.length === 0 ? (
        <div className="bg-white border border-slate-200 rounded-2xl p-10 text-center shadow-sm">
          <p className="text-3xl">🔍</p>
          <p className="mt-3 font-medium text-slate-700">Không tìm thấy từ nào</p>
          <p className="mt-1 text-sm text-slate-500">Thử từ khoá khác hoặc bỏ bộ lọc.</p>
        </div>
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {visible.map(w => (
            <VocabularyCard
              key={w.id}
              word={w}
              isFavorite={favorites.has(w.id)}
              onOpen={onOpen}
              onToggleFavorite={onToggleFavorite}
            />
          ))}
        </div>
      )}

      {filtered.length > visible.length && (
        <div className="text-center pt-2">
          <button
            onClick={() => setLimit(l => l + 60)}

      )}
    </div>
  );
}

function Flashcards({ store, onRate, onExit, seedWordId }) {
  const [direction, setDirection] = useState(store.settings.direction || "en-vi");
  const [queue, setQueue] = useState([]);
  const [total, setTotal] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [finished, setFinished] = useState(false);
  const [reviewed, setReviewed] = useState(0);
  const [initialized, setInitialized] = useState(false);

  // Build session once on mount
  useEffect(() => {
    let ids;
    if (seedWordId) {
      ids = [seedWordId];
    } else {
      const dueIds = WORDS.filter(w => dueToday(store.cards[w.id])).map(w => w.id);
      const newIds = WORDS.filter(w => isNewCard(store.cards[w.id])).map(w => w.id);
      const restIds = WORDS
        .filter(w => !dueIds.includes(w.id) && !newIds.includes(w.id))
        .map(w => w.id);
      ids = [...dueIds, ...newIds, ...restIds].slice(0, SESSION_SIZE);
    }
    setQueue(ids);
    setTotal(ids.length);
    setInitialized(true);
    // eslint-disable-next-line
  }, [seedWordId]);

  // Reset revealed when direction changes
  useEffect(() => { setRevealed(false); }, [direction]);

  const currentId = queue[0];
  const current = currentId ? WORD_BY_ID[currentId] : null;

  const handleRate = (rating) => {
    if (!current) return;
    onRate(current.id, rating);
    setReviewed(r => r + 1);
    setQueue(q => {
      const [head, ...rest] = q;
      if (rating === "again") return [...rest, head];
      return rest;
    });
    setRevealed(false);
  };

  // Detect finish
  useEffect(() => {
    if (initialized && total > 0 && queue.length === 0) {
      setFinished(true);
    }
  }, [queue, total, initialized]);

  if (!initialized) {
    return <div className="text-center py-16 text-slate-400">Đang tải…</div>;
  }

  if (total === 0) {
    return (
      <div className="max-w-xl mx-auto text-center py-16">
        <p className="text-4xl">📚</p>
        <h1 className="mt-4 text-xl font-bold text-slate-900">Không có thẻ nào để học</h1>
        <p className="mt-2 text-slate-500">Hãy thêm từ vựng trước nhé.</p>
        <button
          onClick={onExit}
          className="mt-6 px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition"
        >Về trang chủ</button>
      </div>
    );
  }

  if (finished) {
    return (
      <div className="max-w-xl mx-auto">
        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-8 sm:p-10 text-center">
          <p className="text-5xl">🎉</p>
          <h1 className="mt-4 text-2xl font-bold text-slate-900">Session complete!</h1>
          <p className="mt-2 text-slate-500">
            You reviewed <span className="font-semibold text-slate-800">{total}</span> {total === 1 ? "word" : "words"}.
          </p>
          <p className="mt-1 text-slate-500">Great job!</p>

          <div className="mt-7">
            <button
              onClick={onExit}
              className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition"
            >Continue</button>
          </div>
        </div>
      </div>
    );
  }

  const frontIsEnglish = direction === "en-vi";
  const answeredCount = total - queue.length;

  return (
    <div className="max-w-xl mx-auto space-y-5">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <button
          onClick={onExit}
          className="text-sm font-medium text-slate-500 hover:text-slate-900 transition"
        >← Thoát</button>
        <Segmented
          value={direction}
          onChange={setDirection}
          options={[
            { value: "en-vi", label: "English → Vietnamese" },
            { value: "vi-en", label: "Vietnamese → English" }
          ]}
        />
      </div>

      <div>
        <div className="flex items-center justify-between text-[13px] text-slate-500 mb-2">
          <span>{answeredCount} / {total}</span>
          <span>{queue.length} còn lại</span>
        </div>
        <ProgressBar value={answeredCount} max={total} />
      </div>

      <div className="flip-scene">
        <div
          className={`flip-inner cursor-pointer no-tap-highlight ${revealed ? "flipped" : ""}`}
          onClick={() => setRevealed(r => !r)}
        >
          {/* FRONT */}
          <FlashcardFace side="front">
            <div className="flex-1 flex flex-col items-center justify-center text-center py-6">
              {frontIsEnglish ? (
                <>
                  <h2 className="text-3xl sm:text-4xl font-bold text-slate-900 break-words">{current.word}</h2>
                  <p className="mt-2 text-slate-400">{current.ipa}</p>
                  <div className="mt-4"><PosBadge pos={current.pos} /></div>
                </>
              ) : (
                <>
                  <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-3">Nghĩa tiếng Việt</p>
                  <p className="text-xl sm:text-2xl font-semibold text-slate-900 leading-snug px-2">
                    🇻🇳 {current.vi}
                  </p>
                </>
              )}

              <div className="mt-6" onClick={(e) => e.stopPropagation()}>
                <AudioButton text={current.word} variant="full" />
              </div>
            </div>
            <p className="text-center text-[13px] text-slate-400 pt-4 border-t border-slate-100">Tap to reveal</p>
          </FlashcardFace>

          {/* BACK */}
          <FlashcardFace side="back">
            <div className="flex-1 flex flex-col justify-center py-4">
              <div className="text-center">
                <h2 className="text-2xl sm:text-3xl font-bold text-slate-900 break-words">{current.word}</h2>

              <p className="mt-5 text-center text-[17px] text-slate-900 leading-relaxed">
                <span className="mr-1.5">🇻🇳</span>{current.vi}

              <p className="mt-3 text-center text-sm text-slate-500 leading-relaxed">{current.en}</p>

              <div className="mt-5 rounded-xl bg-slate-50 border border-slate-100 p-4 text-left">
                <p className="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Example</p>
                <p className="mt-1.5 text-sm text-slate-800 italic">“{current.ex}”</p>

                <AudioButton text={current.word} variant="full" />

      </div>

      <div className="min-h-[64px]">
        {revealed ? (
          <div className="grid grid-cols-3 gap-2.5">
            <button

            <button
              onClick={() => handleRate("good")}
              className="py-3 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-700 text-sm font-semibold hover:bg-indigo-100 active:bg-indigo-200 transition"
            >Good</button>
            <button
              onClick={() => handleRate("easy")}
              className="py-3 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 text-sm font-semibold hover:bg-emerald-100 active:bg-emerald-200 transition"
            >Easy</button>
          </div>
        ) : (

        )}
      </div>
    </div>
  );

function buildQuestions(pool, count, direction) {
  const targets = shuffle(pool).slice(0, count);
  const out = [];
  for (const target of targets) {
    const dir = direction === "mixed"
      ? (Math.random() < 0.5 ? "en-vi" : "vi-en")
      : direction;
    const key = dir === "en-vi" ? "vi" : "word";

    const seen = new Set([target[key]]);
    const distractors = [];
    for (const o of shuffle(WORDS)) {
      if (distractors.length >= 3) break;
      if (o.id === target.id) continue;
      if (seen.has(o[key])) continue;
      seen.add(o[key]);
      distractors.push(o);
    }
    if (distractors.length < 1) continue;
    const options = shuffle([target, ...distractors]);
    out.push({ target, dir, options });
  }
  return out;
}

          ) : (
            <>Which word means <span className="font-bold text-indigo-700">“{target.vi}”</span>?</>

          if (revealed) {

              </span>

      {revealed && (

            <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">

function Practice({ store, onAnswerWord, onSessionComplete, onExit }) {
  const [phase, setPhase] = useState("setup");
  const [mode, setMode] = useState("practice");
  const [count, setCount] = useState(10);
  const [direction, setDirection] = useState("en-vi");
  const [source, setSource] = useState("all");
  const [questions, setQuestions] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);
  const [missedIds, setMissedIds] = useState([]);
  const [error, setError] = useState("");
  const finishedRef = React.useRef(false);

  const mistakesCount = store.mistakes.length;
  const newCount = WORDS.filter(w => isNewCard(store.cards[w.id])).length;
  const dueCount = WORDS.filter(w => dueToday(store.cards[w.id])).length;
  const favCount = store.favorites.length;

  const startWith = useCallback((pool, n, dir) => {
    if (!pool || pool.length < 2) {
      setError("Không đủ từ để tạo câu hỏi. Hãy chọn nguồn từ khác.");
      return;
    }
    const qs = buildQuestions(pool, n, dir);
    if (qs.length === 0) {
      setError("Không thể tạo câu hỏi. Hãy thử lại.");
      return;
    }
    setError("");
    setQuestions(qs);
    setQIndex(0);
    setSelected(null);
    setRevealed(false);
    setCorrectCount(0);
    setMissedIds([]);
    finishedRef.current = false;
    setPhase("quiz");
  }, []);

  const start = () => {
    if (mode === "mistakes") {
      const pool = WORDS.filter(w => store.mistakes.includes(w.id));
      startWith(pool, Math.min(count, pool.length), direction);
      return;
    }
    let pool;
    switch (source) {
      case "new":       pool = WORDS.filter(w => isNewCard(store.cards[w.id])); break;
      case "review":    pool = WORDS.filter(w => dueToday(store.cards[w.id]) || store.cards[w.id]?.level === "learning"); break;
      case "favorites": pool = WORDS.filter(w => store.favorites.includes(w.id)); break;
      default:          pool = WORDS;
    }
    startWith(pool, count, direction);
  };

  const handleAnswer = (opt) => {
    if (revealed) return;
    const q = questions[qIndex];
    const correct = opt.id === q.target.id;
    setSelected(opt);
    setRevealed(true);
    if (correct) setCorrectCount(c => c + 1);
    else setMissedIds(m => (m.includes(q.target.id) ? m : [...m, q.target.id]));
    onAnswerWord(q.target.id, correct);
  };

  const next = () => {
    if (qIndex + 1 >= questions.length) {
      // finalize
      const finalCorrect = correctCount; // already updated by the time user clicks
      if (!finishedRef.current) {
        finishedRef.current = true;
        onSessionComplete();
      }
      setPhase("result");
      return;
    }
    setQIndex(i => i + 1);
    setSelected(null);
    setRevealed(false);
  };

  /* ---------- SETUP ---------- */
  if (phase === "setup") {
    return (
      <div className="max-w-2xl mx-auto space-y-5">
        <div>
          <h1 className="text-2xl font-bold text-slate-900">Practice</h1>
          <p className="mt-1 text-sm text-slate-500">Trắc nghiệm nhiều lựa chọn — nhanh và hiệu quả.</p>
        </div>

        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6 space-y-6">
          <div>
            <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-2">Mode</p>
            <Segmented
              value={mode}
              onChange={setMode}
              options={[
                { value: "practice", label: "Practice" },
                { value: "mistakes", label: `Review Mistakes (${mistakesCount})` }
              ]}
            />
            {mode === "mistakes" && mistakesCount === 0 && (
              <p className="mt-2 text-[13px] text-slate-500">Bạn chưa có từ nào trả lời sai. Hãy luyện tập trước nhé!</p>
            )}
          </div>

          {mode === "practice" && (
            <>
              <div>
                <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-2">Number of questions</p>
                <Segmented
                  value={count}
                  onChange={setCount}
                  options={[{ value: 10, label: "10" }, { value: 20, label: "20" }, { value: 30, label: "30" }]}
                />
              </div>

              <div>
                <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-2">Question direction</p>
                <Segmented
                  value={direction}
                  onChange={setDirection}
                  options={[
                    { value: "en-vi", label: "English → Vietnamese" },
                    { value: "vi-en", label: "Vietnamese → English" },
                    { value: "mixed", label: "Mixed" }
                  ]}
                />
              </div>

              <div>
                <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase mb-2">Vocabulary</p>
                <Segmented
                  value={source}
                  onChange={setSource}
                  options={[
                    { value: "all", label: `All (${WORDS.length})` },
                    { value: "new", label: `New (${newCount})` },
                    { value: "review", label: `Review (${dueCount})` },
                    { value: "favorites", label: `Favorites (${favCount})` }
                  ]}
                />
              </div>
            </>
          )}

          {error && (
            <p className="text-sm text-rose-600 bg-rose-50 border border-rose-100 rounded-xl px-4 py-3">{error}</p>
          )}

          <button
            onClick={start}
            disabled={mode === "mistakes" && mistakesCount === 0}
            className={`w-full py-3 rounded-xl text-sm font-semibold transition
              ${mode === "mistakes" && mistakesCount === 0
                ? "bg-slate-200 text-slate-400 cursor-not-allowed"
                : "bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800"}`}
          >Start Practice</button>
        </div>
      </div>
    );
  }

  /* ---------- RESULT ---------- */
  if (phase === "result") {
    return (
      <PracticeResult
        total={questions.length}
        correct={correctCount}
        missedIds={missedIds}
        onPracticeMistakes={() => {
          const pool = missedIds.map(id => WORD_BY_ID[id]).filter(Boolean);
          if (pool.length < 2) {
            setError("Không đủ từ để luyện lại.");
            setPhase("setup");
            return;
          }
          setMode("mistakes");
          startWith(pool, pool.length, direction);
        }}
        onRestart={() => setPhase("setup")}
        onExit={onExit}
      />
    );
  }

  /* ---------- QUIZ ---------- */
  const q = questions[qIndex];
  if (!q) {
    return (
      <div className="text-center py-16 text-slate-400">
        Đang tải câu hỏi…
      </div>
    );
  }

  return (
    <div className="space-y-5">
      <button
        onClick={() => setPhase("setup")}
        className="text-sm font-medium text-slate-500 hover:text-slate-900 transition"
      >← Thoát</button>

      <MultipleChoice
        question={q}
        index={qIndex}
        total={questions.length}
        selected={selected}
        revealed={revealed}
        onAnswer={handleAnswer}
        onNext={next}
        isLast={qIndex + 1 >= questions.length}
      />
    </div>
  );
}

/* ============================================================
   PROGRESS
   ============================================================ */
function Progress({ store }) {
  const total = WORDS.length;
  const mastered = WORDS.filter(w => store.cards[w.id]?.level === "mastered").length;
  const learning = WORDS.filter(w => {
    const c = store.cards[w.id];
    return c && c.lastReviewed && c.level !== "mastered";
  }).length;
  const newCount = total - mastered - learning;

  const accuracy = store.stats.practiceTotal > 0
    ? Math.round((store.stats.practiceCorrect / store.stats.practiceTotal) * 100)
    : 0;

  const week = useMemo(() => {
    const labels = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = dateKey(d);
      out.push({ key: k, label: labels[d.getDay()], value: store.activity[k] || 0, isToday: i === 0 });
    }
    return out;
  }, [store.activity]);

  const maxVal = Math.max(1, ...week.map(d => d.value));
  const weekTotal = week.reduce((s, d) => s + d.value, 0);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Progress</h1>
        <p className="mt-1 text-sm text-slate-500">Theo dõi tiến độ học từ vựng của bạn.</p>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6">
        <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Vocabulary progress</p>
        <p className="mt-2 text-3xl font-bold text-slate-900">{total}</p>
        <p className="text-sm text-slate-500">Total words</p>

        <div className="mt-5">
          <div className="h-2.5 w-full rounded-full overflow-hidden flex bg-slate-100">
            <div className="bg-emerald-500 h-full" style={{ width: (mastered / total) * 100 + "%" }} />
            <div className="bg-amber-400 h-full" style={{ width: (learning / total) * 100 + "%" }} />
            <div className="bg-slate-200 h-full" style={{ width: (newCount / total) * 100 + "%" }} />
          </div>
          <div className="mt-4 grid grid-cols-3 gap-3">
            {[
              { label: "Mastered", value: mastered, dot: "bg-emerald-500", tone: "text-emerald-700" },
              { label: "Learning", value: learning, dot: "bg-amber-400", tone: "text-amber-700" },
              { label: "New", value: newCount, dot: "bg-slate-300", tone: "text-slate-600" }
            ].map(s => (
              <div key={s.label}>
                <div className="flex items-center gap-1.5">
                  <span className={`w-2 h-2 rounded-full ${s.dot}`} />
                  <span className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">{s.label}</span>
                </div>
                <p className={`mt-1 text-xl font-bold ${s.tone}`}>{s.value}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6">
        <div className="flex items-end justify-between mb-3">
          <div>
            <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Accuracy</p>
            <p className="mt-1 text-sm text-slate-500">Practice accuracy</p>
          </div>
          <p className="text-2xl font-bold text-slate-900">{accuracy}%</p>
        </div>
        <ProgressBar
          value={accuracy}
          max={100}
          color={accuracy >= 80 ? "bg-emerald-500" : accuracy >= 60 ? "bg-amber-400" : "bg-rose-400"}
        />
        <p className="mt-2 text-[13px] text-slate-400">
          {store.stats.practiceCorrect} / {store.stats.practiceTotal} câu trả lời đúng
        </p>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6 flex items-center justify-between">
        <div>
          <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Learning streak</p>
          <p className="mt-1.5 text-xl font-bold text-slate-900">🔥 {store.streak.count} day{store.streak.count === 1 ? "" : "s"} streak</p>
          <p className="mt-0.5 text-[13px] text-slate-500">Học mỗi ngày để giữ chuỗi nhé!</p>
        </div>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6">
        <div className="flex items-end justify-between mb-5">
          <div>
            <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Weekly activity</p>
            <p className="mt-1 text-sm text-slate-500">Words learned each day</p>
          </div>
          <p className="text-sm font-semibold text-slate-700">{weekTotal} tuần này</p>
        </div>

        <div className="flex items-end justify-between gap-2 h-36">
          {week.map(d => (
            <div key={d.key} className="flex-1 flex flex-col items-center justify-end h-full gap-2">
              <span className="text-[11px] font-medium text-slate-500">{d.value > 0 ? d.value : ""}</span>
              <div className="w-full flex-1 flex items-end">
                <div
                  className={`w-full rounded-t-lg transition-all duration-500 ${d.isToday ? "bg-indigo-600" : "bg-indigo-200"}`}
                  style={{ height: Math.max(d.value > 0 ? 8 : 3, (d.value / maxVal) * 100) + "%" }}
                />
              </div>
              <span className={`text-[11px] ${d.isToday ? "font-semibold text-indigo-700" : "text-slate-400"}`}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 sm:p-6">
        <p className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Upcoming reviews</p>
        <p className="mt-2 text-sm text-slate-600">
          <span className="font-semibold text-slate-900">
            {WORDS.filter(w => dueToday(store.cards[w.id])).length}
          </span> từ cần ôn hôm nay ·{" "}
          <span className="font-semibold text-slate-900">{store.mistakes.length}</span> từ hay sai
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   NAVBAR
   ============================================================ */
const NAV_ITEMS = [
  { id: "home", label: "Home", icon: "🏠" },
  { id: "vocabulary", label: "Vocabulary", icon: "📚" },
  { id: "flashcards", label: "Flashcards", icon: "🃏" },
  { id: "practice", label: "Practice", icon: "📝" },
  { id: "progress", label: "Progress", icon: "📊" }
];

function Navbar({ page, onNavigate, dueCount }) {
  return (
    <>
      <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
          <button
            onClick={() => onNavigate("home")}
            className="flex items-center gap-2.5 no-tap-highlight"
          >
            <span className="w-9 h-9 rounded-xl bg-indigo-600 text-white grid place-items-center font-bold text-sm shadow-sm">VV</span>
            <span className="font-semibold text-slate-900 hidden sm:inline">
              Vocab<span className="text-indigo-600">Viet</span>
            </span>
          </button>

          <nav className="hidden md:flex items-center gap-1">
            {NAV_ITEMS.map(item => {
              const active = page === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => onNavigate(item.id)}
                  className={`relative px-3.5 py-2 rounded-xl text-sm font-medium transition
                    ${active ? "bg-indigo-50 text-indigo-700" : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"}`}
                >
                  <span className="mr-1.5">{item.icon}</span>{item.label}
                  {item.id === "home" && dueCount > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 grid place-items-center rounded-full bg-indigo-600 text-white text-[10px] font-bold">
                      {dueCount > 99 ? "99+" : dueCount}
                    </span>
                  )}
                </button>
              );
            })}
          </nav>

          <div className="md:hidden text-[13px] text-slate-400">
            {dueCount > 0 ? `${dueCount} từ cần ôn` : "Sẵn sàng học"}
          </div>
        </div>
      </header>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 pb-[env(safe-area-inset-bottom)]">
        <div className="grid grid-cols-5">
          {NAV_ITEMS.map(item => {
            const active = page === item.id;
            return (
              <button
                key={item.id}
                onClick={() => onNavigate(item.id)}
                className={`relative flex flex-col items-center gap-0.5 py-2.5 no-tap-highlight transition
                  ${active ? "text-indigo-600" : "text-slate-500"}`}
              >
                <span className="text-[18px] leading-none">{item.icon}</span>
                <span className={`text-[10px] ${active ? "font-semibold" : "font-medium"}`}>{item.label}</span>
                {item.id === "home" && dueCount > 0 && (
                  <span className="absolute top-1.5 right-1/2 translate-x-4 w-2 h-2 rounded-full bg-indigo-600" />
                )}
              </button>
            );
          })}
        </div>
      </nav>
    </>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [store, setStore] = useState(loadStore);
  const [page, setPage] = useState("home");
  const [detailId, setDetailId] = useState(null);
  const [flashSeed, setFlashSeed] = useState(null);
  const [flashKey, setFlashKey] = useState(0);

  useEffect(() => { saveStore(store); }, [store]);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [page, detailId]);

  const favorites = useMemo(() => new Set(store.favorites), [store.favorites]);
  const dueCount = useMemo(
    () => WORDS.filter(w => dueToday(store.cards[w.id])).length,
    [store.cards]
  );

  /* ---- streak + activity helper ---- */
  const bumpActivity = (prev, amount) => {
    const today = dateKey();
    const activity = { ...prev.activity };
    if (amount) {
      activity[today] = (activity[today] || 0) + amount;
    }
    let streak = { ...prev.streak };
    if (streak.last !== today) {
      const yesterday = dateKey(new Date(Date.now() - DAY));
      streak.count = streak.last === yesterday ? (streak.count || 0) + 1 : 1;
      streak.last = today;
    }
    return { activity, streak };
  };

  const rateWord = useCallback((id, rating) => {
    setStore(prev => {
      const card = applyRating(prev.cards[id], rating);
      const { activity, streak } = bumpActivity(prev, 1);
      let mistakes = prev.mistakes;
      if (rating !== "again" && mistakes.includes(id)) {
        mistakes = mistakes.filter(m => m !== id);
      }
      return {
        ...prev,
        cards: { ...prev.cards, [id]: card },
        activity, streak, mistakes
      };
    });
  }, []);

  const answerWord = useCallback((id, correct) => {
    setStore(prev => {
      const card = applyRating(prev.cards[id], correct ? "good" : "again");
      let mistakes = prev.mistakes;
      if (correct) mistakes = mistakes.filter(m => m !== id);
      else if (!mistakes.includes(id)) mistakes = [...mistakes, id];
      return {
        ...prev,
        cards: { ...prev.cards, [id]: card },
        mistakes,
        stats: {
          practiceCorrect: prev.stats.practiceCorrect + (correct ? 1 : 0),
          practiceTotal: prev.stats.practiceTotal + 1
        }
      };
    });
  }, []);

  const completeSession = useCallback(() => {
    setStore(prev => {
      const { activity, streak } = bumpActivity(prev, 1);
      return { ...prev, activity, streak };
    });
  }, []);

  const toggleFavorite = useCallback((id) => {
    setStore(prev => {
      const has = prev.favorites.includes(id);
      return {
        ...prev,
        favorites: has ? prev.favorites.filter(f => f !== id) : [...prev.favorites, id]
      };
    });
  }, []);

  const navigate = (p) => {
    setDetailId(null);
    setPage(p);
  };

  const openWord = (id) => {
    setDetailId(id);
    setPage("vocabulary");
  };

  const startFlashcards = (seedId = null) => {
    setFlashSeed(seedId);
    setFlashKey(k => k + 1);
    setDetailId(null);
    setPage("flashcards");
  };

  const detailWord = detailId ? WORD_BY_ID[detailId] : null;

  return (
    <div className="min-h-screen bg-slate-50 flex flex-col">
      <Navbar page={page} onNavigate={navigate} dueCount={dueCount} />

      <main className="flex-1 w-full max-w-5xl mx-auto px-4 py-6 sm:py-8 pb-24 md:pb-10">
        {page === "home" && (
          <Home
            store={store}
            onNavigate={navigate}
            onStartReview={() => startFlashcards(null)}
            onStartFlashcards={() => startFlashcards(null)}
            onOpenWord={openWord}
          />
        )}

        {page === "vocabulary" && (
          detailWord ? (
            <VocabularyDetail
              word={detailWord}
              isFavorite={favorites.has(detailWord.id)}
              onToggleFavorite={toggleFavorite}
              onBack={() => setDetailId(null)}
              onFlashcard={(id) => startFlashcards(id)}
            />
          ) : (
            <Vocabulary
              favorites={favorites}
              onOpen={openWord}
              onToggleFavorite={toggleFavorite}
            />
          )
        )}

        {page === "flashcards" && (
          <Flashcards
            key={flashKey}
            store={store}
            onRate={rateWord}
            onExit={() => navigate("home")}
            seedWordId={flashSeed}
          />
        )}

        {page === "practice" && (
          <Practice
            store={store}
            onAnswerWord={answerWord}
            onSessionComplete={completeSession}
            onExit={() => navigate("home")}
          />
        )}

        {page === "progress" && <Progress store={store} />}
      </main>

      <footer className="hidden md:block border-t border-slate-200 bg-white/60">
        <div className="max-w-5xl mx-auto px-4 py-5 text-center text-[13px] text-slate-400">
          VocabViet · Học từ vựng tiếng Anh mỗi ngày · Tiến độ được lưu trên thiết bị của bạn
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
