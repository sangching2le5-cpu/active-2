<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ACTIVE 2 — Interactive Vocabulary Learning App">
<title>ACTIVE 2 — Vocabulary Learning</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR (desktop) ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-badge">A2</div>
      <div class="brand-text">
        <strong>ACTIVE 2</strong>
        <span>Vocabulary</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#/home"       class="nav-item" data-nav="home">       <span class="ni">🏠</span> Home</a>
      <a href="#/vocabulary" class="nav-item" data-nav="vocabulary"> <span class="ni">📚</span> Vocabulary</a>
      <a href="#/flashcards" class="nav-item" data-nav="flashcards"> <span class="ni">🃏</span> Flashcards</a>
      <a href="#/quiz"       class="nav-item" data-nav="quiz">       <span class="ni">📝</span> Quiz</a>
      <a href="#/favourites" class="nav-item" data-nav="favourites"> <span class="ni">⭐</span> Favourites</a>
      <a href="#/difficult"  class="nav-item" data-nav="difficult">  <span class="ni">⚠️</span> Difficult</a>
      <a href="#/progress"   class="nav-item" data-nav="progress">   <span class="ni">📊</span> Progress</a>
      <a href="#/settings"   class="nav-item" data-nav="settings">   <span class="ni">⚙️</span> Settings</a>
    </nav>

    <div class="sidebar-foot">
      <button class="theme-btn" id="themeToggle" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark mode</span>
      </button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="globalSearch" class="search-input"
               placeholder="Search vocabulary…" aria-label="Search vocabulary" autocomplete="off">
      </div>
      <button class="icon-btn only-mobile" id="themeToggleMobile" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- ================= MOBILE DRAWER ================= -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>

<!-- ================= BOTTOM NAV (mobile) ================= -->
<nav class="bottom-nav" aria-label="Mobile navigation">
  <a href="#/home"       class="bn-item" data-nav="home">       <span>🏠</span><small>Home</small></a>
  <a href="#/vocabulary" class="bn-item" data-nav="vocabulary"> <span>📚</span><small>Words</small></a>
  <a href="#/flashcards" class="bn-item" data-nav="flashcards"> <span>🃏</span><small>Cards</small></a>
  <a href="#/quiz"       class="bn-item" data-nav="quiz">       <span>📝</span><small>Quiz</small></a>
  <a href="#/progress"   class="bn-item" data-nav="progress">   <span>📊</span><small>Stats</small></a>
</nav>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
